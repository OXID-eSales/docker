name: Build php images and push to Docker Hub

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      docker_hub_user: ${{ secrets.DOCKER_HUB_USER }}
    strategy:
      fail-fast: false
      matrix:
        php_version: ["8.1", "8.6-rc"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve build args
        id: args
        run: |
          {
            echo 'build_args<<BUILD_ARGS_EOF'
            bash php/build.sh --emit-args '${{ matrix.php_version }}'
            echo 'BUILD_ARGS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: build and push docker images
        uses: 'OXID-eSales/github-actions/build_docker@v5'
        with:
          dockerhub_username: ${{ secrets.DOCKER_HUB_USER }}
          dockerhub_password: ${{ secrets.DOCKER_HUB_TOKEN }}
          image_name: php
          platforms: linux/amd64,linux/arm64
          build-args: ${{ steps.args.outputs.build_args }}
          tags: |
            oxidesales/oxideshop-docker-php:${{ matrix.php_version }}

  finish:
    if: always()
    needs: build
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK: "${{ secrets.SLACK_DEVOPS_WEBHOOK_URL }}"
    steps:
      - name: Send custom JSON data to Slack workflow
        if: ${{ always() && env.SLACK_WEBHOOK != '' }}
        uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.SLACK_DEVOPS_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {"text": "${{ github.workflow }} on ${{ github.repository }} (<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Summary>) ${{ needs.build.result == 'success' && ':white_check_mark:' || ':x:' }} ${{ needs.build.result }}"}
