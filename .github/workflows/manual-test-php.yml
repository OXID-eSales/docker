name: Build MySQL and MariaDB images and push to Docker Hub

on:
  workflow_dispatch:

jobs:
  build_mysql:
    runs-on: ubuntu-latest
    env:
      docker_hub_user: ${{ secrets.DOCKER_HUB_USER }}
    strategy:
      fail-fast: false
      matrix:
        mysql_version: ["5.7"]
    steps:
      - name: build and push docker images
        uses: 'OXID-eSales/github-actions/build_docker@v5'
        with:
          dockerhub_username: ${{ secrets.DOCKER_HUB_USER }}
          dockerhub_password: ${{ secrets.DOCKER_HUB_TOKEN }}
          image_name: mysql
          platforms: linux/amd64
          tags: |
              oxidesales/oxideshop-docker-database:${{ matrix.mysql_version }}
              oxidesales/oxideshop-docker-database:mysql-${{ matrix.mysql_version }}
          build-args: |
            MYSQL_VERSION=${{ matrix.mysql_version }}

  build_mariadb:
    runs-on: ubuntu-26.04
    env:
      docker_hub_user: ${{ secrets.DOCKER_HUB_USER }}
    strategy:
      fail-fast: false
      matrix:
        mariadb_version: ["10"]
    steps:
      - name: build and push docker images
        uses: 'OXID-eSales/github-actions/build_docker@v5'
        with:
          dockerhub_username: ${{ secrets.DOCKER_HUB_USER }}
          dockerhub_password: ${{ secrets.DOCKER_HUB_TOKEN }}
          image_name: mariadb
          platforms: linux/amd64
          tags: |
              oxidesales/oxideshop-docker-database:mariadb-${{ matrix.mariadb_version }}
          build-args: |
            MARIADB_VERSION=${{ matrix.mariadb_version }}

  finish:
    if: always()
    needs: [build_mysql, build_mariadb]
    runs-on: ubuntu-26.04
    env:
      SLACK_WEBHOOK: "${{ secrets.SLACK_DEVOPS_WEBHOOK_URL }}"
    steps:
      - name: Send custom JSON data to Slack workflow
        if: ${{ always() && env.SLACK_WEBHOOK != '' }}
        uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.SLACK_DEVOPS_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {"text": "${{ github.workflow }} on ${{ github.repository }} (<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Summary>) mysql ${{ needs.build_mysql.result == 'success' && ':white_check_mark:' || ':x:' }} ${{ needs.build_mysql.result }}, mariadb ${{ needs.build_mariadb.result == 'success' && ':white_check_mark:' || ':x:' }} ${{ needs.build_mariadb.result }}"}
