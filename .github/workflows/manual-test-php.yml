name: Manually test php image builds

on:
  workflow_dispatch:
    inputs:
      versions:
        type: string
        required: true
        default: '["7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5", "8.6-rc"]'
        description: Array of versions
  workflow_call:
    inputs:
      versions:
        type: string
        required: true
        default: '["7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5", "8.6-rc"]'
        description: Array of versions

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      docker_hub_user: ${{ secrets.DOCKER_HUB_USER }}
    strategy:
      fail-fast: false
      matrix:
        php_version: ${{ fromJSON(inputs.versions) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve build args
        id: args
        run: |
          {
            echo 'build_args<<BUILD_ARGS_EOF'
            bash php/build.sh --emit-args '${{ matrix.php_version }}'
            echo 'BUILD_ARGS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: build and push docker images
        uses: 'OXID-eSales/github-actions/build_docker@v4'
        with:
          dockerhub_username: ${{ secrets.DOCKER_HUB_USER }}
          dockerhub_password: ${{ secrets.DOCKER_HUB_TOKEN }}
          image_name: php
          platforms: linux/amd64,linux/arm64
          build-args: ${{ steps.args.outputs.build_args }}
          tags: |
            oxidesales/oxideshop-docker-php:${{ matrix.php_version }}-test

  finish:
    if: always()
    needs: build
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK: "${{ secrets.SLACK_DEVOPS_WEBHOOK_URL }}"
    steps:
      - name: Send custom JSON data to Slack workflow
        if: ${{ always() && env.SLACK_WEBHOOK != '' }}
        uses: 'OXID-eSales/github-actions/slack_status@v4'
        with:
          slack_webhook: ${{ secrets.SLACK_DEVOPS_WEBHOOK_URL }}
          title: '${{ github.workflow }} on ${{ github.repository }} by ${{ github.actor }}'
          summary_list: |
            Repository%${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          install_list: |
            build%${{ needs.build.result }}
