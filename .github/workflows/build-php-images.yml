name: Build php images and push to Docker Hub

on:
  schedule:
    - cron: '0 0 * * 0'
  push:
    branches:
      - master
    paths:
      - 'php/**'
      - '.github/workflows/build-php-images.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      docker_hub_user: ${{ secrets.DOCKER_HUB_USER }}
    strategy:
      fail-fast: false
      matrix:
        php_version: ["8.6-rc"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve build args
        id: args
        run: |
          {
            echo 'build_args<<BUILD_ARGS_EOF'
            bash php/build.sh --emit-args '${{ matrix.php_version }}'
            echo 'BUILD_ARGS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: 'DRY RUN: show what build_docker would receive'
        env:
          BUILD_ARGS: ${{ steps.args.outputs.build_args }}
        run: |
          echo "image: oxidesales/oxideshop-docker-php:${{ matrix.php_version }}"
          echo "build-args:"
          printf '%s\n' "$BUILD_ARGS"

#      - name: build and push docker images
#        uses: 'OXID-eSales/github-actions/build_docker@v4'
#        with:
#          dockerhub_username: ${{ secrets.DOCKER_HUB_USER }}
#          dockerhub_password: ${{ secrets.DOCKER_HUB_TOKEN }}
#          image_name: php
#          platforms: linux/amd64,linux/arm64
#          build-args: ${{ steps.args.outputs.build_args }}
#          tags: |
#            oxidesales/oxideshop-docker-php:${{ matrix.php_version }}

  finish:
    if: always()
    needs: build
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK: "${{ secrets.SLACK_DEVOPS_WEBHOOK_URL }}"
    steps:
      - name: Send custom JSON data to Slack workflow
        if: ${{ always() && env.SLACK_WEBHOOK != '' }}
        uses: 'OXID-eSales/github-actions/slack_status@v4'
        with:
          slack_webhook: ${{ secrets.SLACK_DEVOPS_WEBHOOK_URL }}
          title: '${{ github.workflow }} on ${{ github.repository }} by ${{ github.actor }}'
          summary_list: |
            Repository%${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          install_list: |
            build%${{ needs.build.result }}
